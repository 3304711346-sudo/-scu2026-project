# 应用服务 WEB 访问端口
server.port=8080

# 数据源配置（请根据你的数据库修改）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/your_database?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=your_password

# MyBatis-Plus 配置
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
mybatis-plus：
  mappper-locations=classpath*:mapper/*.xml
  configuration：
    map-enderscore-to-camel-case=true

